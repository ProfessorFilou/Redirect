<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProfessorFilou.de – Link Generator & Weiterleitung</title>
    <style>
        :root {
            --bg-gradient-start: #ffffff;
            --bg-gradient-end: #f0f6ff;
            --card-bg: #ffffff;
            --surface-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-light: #eff6ff;
            --accent-glow: rgba(37, 99, 235, 0.14);
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(145deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 470px;
            background: var(--card-bg);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 28px;
            padding: 40px 34px;
            box-shadow: 0 20px 45px -12px var(--accent-glow), 0 4px 16px -4px rgba(15, 23, 42, 0.04);
        }

        .brand-pill {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            background: var(--accent-light);
            padding: 7px 15px;
            border-radius: 999px;
            margin-bottom: 22px;
        }

        .brand-dot {
            width: 9px;
            height: 9px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .brand-name {
            font-weight: 700;
            font-size: 0.92rem;
            letter-spacing: -0.01em;
            color: var(--text-main);
        }

        .brand-name span {
            color: var(--accent);
        }

        h1 {
            font-size: 1.55rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.025em;
            line-height: 1.25;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.55;
            margin-bottom: 26px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 7px;
            margin-left: 4px;
            color: var(--text-main);
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid var(--border-color);
            border-radius: 16px;
            font-size: 0.95rem;
            color: var(--text-main);
            background: var(--surface-color);
            transition: all 0.22s ease;
            outline: none;
        }

        input[type="text"]:focus,
        select:focus {
            background: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-light);
        }

        .btn {
            width: 100%;
            padding: 15px 24px;
            margin-top: 4px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border: none;
            border-radius: 999px;
            font-size: 0.98rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px -6px rgba(37, 99, 235, 0.45);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px -6px rgba(37, 99, 235, 0.55);
        }

        .btn:active {
            transform: translateY(0) scale(0.99);
        }

        .result-box {
            display: none;
            margin-top: 26px;
            padding-top: 22px;
            border-top: 1px solid var(--border-color);
            animation: fadeIn 0.35s ease;
        }

        .share-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface-color);
            border: 1.5px solid var(--border-color);
            border-radius: 999px;
            padding: 5px 5px 5px 16px;
            margin-top: 6px;
        }

        .share-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 0.85rem;
            color: var(--text-main);
            outline: none;
            min-width: 0;
        }

        .btn-copy {
            padding: 10px 18px;
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-copy:hover {
            background: var(--accent-hover);
        }

        .redirect-view {
            display: none;
            text-align: center;
            padding: 8px 0;
        }

        .spinner {
            width: 46px;
            height: 46px;
            border: 4px solid var(--accent-light);
            border-top-color: var(--accent);
            border-radius: 50%;
            margin: 0 auto 22px auto;
            animation: spin 0.85s linear infinite;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--accent-light);
            border-radius: 999px;
            overflow: hidden;
            margin: 22px 0 16px 0;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            border-radius: 999px;
            transition: width linear;
        }

        .target-preview {
            font-size: 0.82rem;
            color: var(--text-muted);
            word-break: break-all;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 16px;
            margin-top: 14px;
        }

        .direct-link {
            display: inline-block;
            margin-top: 18px;
            font-size: 0.85rem;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 999px;
            transition: background 0.2s ease;
        }

        .direct-link:hover {
            background: var(--accent-light);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand-pill">
            <div class="brand-dot"></div>
            <div class="brand-name">Professor<span>Filou</span>.de</div>
        </div>

        <!-- Ansicht 1: Link Generator -->
        <div id="generator-view">
            <h1>Link erstellen & teilen</h1>
            <p class="subtitle">Gib einfach eine beliebige Adresse ein. Besucher landen kurz auf ProfessorFilou.de und werden dann weitergeleitet.</p>

            <form id="link-form">
                <div class="input-group">
                    <label for="target-url">Wohin soll der Link führen?</label>
                    <input type="text" id="target-url" placeholder="z. B. youtube.com oder beispiel.de/info" autocomplete="off" required>
                </div>

                <div class="input-group">
                    <label for="delay-select">Kurzer Stopp auf ProfessorFilou.de</label>
                    <select id="delay-select">
                        <option value="2">2 Sekunden (Kurz)</option>
                        <option value="3" selected>3 Sekunden (Standard)</option>
                        <option value="5">5 Sekunden (Mittel)</option>
                    </select>
                </div>

                <button type="submit" class="btn">Teilbaren Link generieren</button>
            </form>

            <div class="result-box" id="result-box">
                <label>Dein fertiger Link zum Teilen:</label>
                <div class="share-row">
                    <input type="text" id="generated-link" class="share-input" readonly>
                    <button type="button" id="copy-btn" class="btn-copy">Kopieren</button>
                </div>
            </div>
        </div>

        <!-- Ansicht 2: Weiterleitung aktiv -->
        <div id="redirect-view" class="redirect-view">
            <div class="spinner"></div>
            <h1>Du wirst weitergeleitet...</h1>
            <p class="subtitle" id="countdown-text">Einen kurzen Moment bitte. Du verlässt gleich ProfessorFilou.de.</p>

            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>

            <div class="target-preview" id="target-display"></div>
            <a href="#" id="manual-link" class="direct-link">Sofort öffnen →</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const encodedTarget = params.get('to');
        const delayParam = parseInt(params.get('t'), 10);

        const generatorView = document.getElementById('generator-view');
        const redirectView = document.getElementById('redirect-view');

        if (encodedTarget) {
            try {
                const base64 = encodedTarget.replace(/-/g, '+').replace(/_/g, '/');
                const targetUrl = decodeURIComponent(escape(window.atob(base64)));

                const parsedUrl = new URL(targetUrl);
                if (parsedUrl.protocol === 'http:' || parsedUrl.protocol === 'https:') {
                    startRedirect(parsedUrl.href, isNaN(delayParam) ? 3 : Math.min(Math.max(delayParam, 1), 15));
                } else {
                    showGenerator();
                }
            } catch (e) {
                showGenerator();
            }
        } else {
            showGenerator();
        }

        function showGenerator() {
            generatorView.style.display = 'block';
            redirectView.style.display = 'none';
        }

        function startRedirect(url, seconds) {
            generatorView.style.display = 'none';
            redirectView.style.display = 'block';

            document.getElementById('target-display').textContent = 'Ziel: ' + url.replace(/^https?:\/\//i, '');
            document.getElementById('manual-link').href = url;

            const progressFill = document.getElementById('progress-fill');
            const countdownText = document.getElementById('countdown-text');

            setTimeout(() => {
                progressFill.style.transitionDuration = seconds + 's';
                progressFill.style.width = '100%';
            }, 50);

            let remaining = seconds;
            countdownText.textContent = `Weiterleitung in ${remaining} Sekunde${remaining === 1 ? '' : 'n'}...`;

            const timer = setInterval(() => {
                remaining--;
                if (remaining > 0) {
                    countdownText.textContent = `Weiterleitung in ${remaining} Sekunde${remaining === 1 ? '' : 'n'}...`;
                } else {
                    clearInterval(timer);
                    countdownText.textContent = 'Leite jetzt weiter...';
                    window.location.replace(url);
                }
            }, 1000);
        }

        document.getElementById('link-form').addEventListener('submit', function(e) {
            e.preventDefault();
            let rawUrl = document.getElementById('target-url').value.trim();
            const delay = document.getElementById('delay-select').value;

            if (!rawUrl) return;

            // Fügt https:// automatisch hinzu, wenn es weggelassen wurde
            if (!/^https?:\/\//i.test(rawUrl)) {
                rawUrl = 'https://' + rawUrl;
            }

            const encoded = window.btoa(unescape(encodeURIComponent(rawUrl)))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');

            const baseUrl = window.location.origin + window.location.pathname;
            const shareUrl = `${baseUrl}?to=${encoded}&t=${delay}`;

            const resultBox = document.getElementById('result-box');
            const generatedInput = document.getElementById('generated-link');

            generatedInput.value = shareUrl;
            resultBox.style.display = 'block';
        });

        document.getElementById('copy-btn').addEventListener('click', function() {
            const copyInput = document.getElementById('generated-link');
            copyInput.select();
            copyInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyInput.value);

            const btn = this;
            const originalText = btn.textContent;
            btn.textContent = 'Kopiert ✓';
            btn.style.backgroundColor = '#10b981';

            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.backgroundColor = '';
            }, 2000);
        });
    </script>
</body>
</html>

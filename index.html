<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProfessorFilou.de – Link Generator & Weiterleitung</title>
    <style>
        :root {
            --bg-gradient-start: #ffffff;
            --bg-gradient-end: #eff6ff;
            --card-bg: #ffffff;
            --surface-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-light: #eff6ff;
            --accent-glow: rgba(37, 99, 235, 0.15);
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #dbeafe 0%, var(--bg-gradient-start) 45%, var(--bg-gradient-end) 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 32px;
            padding: 40px 34px;
            box-shadow: 0 24px 50px -12px var(--accent-glow), 0 4px 18px -4px rgba(15, 23, 42, 0.04);
            animation: cardEntrance 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .brand-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--accent-light);
            padding: 8px 16px;
            border-radius: 999px;
            margin-bottom: 22px;
        }

        .brand-dot {
            width: 9px;
            height: 9px;
            background-color: var(--accent);
            border-radius: 50%;
            animation: pulseDot 2.2s infinite ease-in-out;
        }

        .brand-name {
            font-weight: 700;
            font-size: 0.92rem;
            letter-spacing: -0.01em;
            color: var(--text-main);
        }

        .brand-name span {
            color: var(--accent);
        }

        h1 {
            font-size: 1.58rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.025em;
            line-height: 1.25;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.55;
            margin-bottom: 26px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 7px;
            margin-left: 6px;
            color: var(--text-main);
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid var(--border-color);
            border-radius: 18px;
            font-size: 0.95rem;
            color: var(--text-main);
            background: var(--surface-color);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
        }

        input[type="text"]:focus,
        select:focus {
            background: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-light);
            transform: translateY(-1px);
        }

        .btn {
            width: 100%;
            padding: 15px 24px;
            margin-top: 4px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: #ffffff;
            border: none;
            border-radius: 999px;
            font-size: 0.98rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 22px -6px rgba(37, 99, 235, 0.45);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -6px rgba(37, 99, 235, 0.55);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        .result-box {
            display: none;
            margin-top: 26px;
            padding-top: 22px;
            border-top: 1px solid var(--border-color);
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .share-row {
            display: flex;
            align-items: center;
            background: var(--surface-color);
            border: 1.5px solid var(--border-color);
            border-radius: 999px;
            padding: 6px 8px 6px 18px;
            margin-top: 6px;
            margin-bottom: 12px;
        }

        .share-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 0.86rem;
            color: var(--text-main);
            outline: none;
            min-width: 0;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 12px 16px;
            border: none;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-copy {
            background: var(--accent-light);
            color: var(--accent);
        }

        .btn-copy:hover {
            background: #dbeafe;
            transform: translateY(-1px);
        }

        .btn-share {
            background: var(--accent);
            color: #ffffff;
            box-shadow: 0 6px 16px -4px rgba(37, 99, 235, 0.4);
        }

        .btn-share:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-action:active {
            transform: scale(0.97);
        }

        .redirect-view {
            display: none;
            text-align: center;
            padding: 8px 0;
            animation: popIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .spinner-wrap {
            position: relative;
            width: 52px;
            height: 52px;
            margin: 0 auto 22px auto;
        }

        .spinner {
            width: 52px;
            height: 52px;
            border: 4px solid var(--accent-light);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.85s linear infinite;
        }

        .progress-bar-bg {
            width: 100%;
            height: 9px;
            background: var(--accent-light);
            border-radius: 999px;
            overflow: hidden;
            margin: 22px 0 16px 0;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #60a5fa, #2563eb);
            border-radius: 999px;
            transition: width linear;
        }

        .target-preview {
            font-size: 0.82rem;
            color: var(--text-muted);
            word-break: break-all;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 11px 18px;
            border-radius: 18px;
            margin-top: 14px;
        }

        .direct-link {
            display: inline-block;
            margin-top: 18px;
            font-size: 0.86rem;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 999px;
            transition: all 0.2s ease;
        }

        .direct-link:hover {
            background: var(--accent-light);
            transform: translateX(2px);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(18px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(8px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.45); }
            50% { transform: scale(1.15); box-shadow: 0 0 0 6px rgba(37, 99, 235, 0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand-pill">
            <div class="brand-dot"></div>
            <div class="brand-name">Professor<span>Filou</span>.de</div>
        </div>

        <!-- Ansicht 1: Link Generator -->
        <div id="generator-view">
            <h1>Link erstellen & teilen</h1>
            <p class="subtitle">Gib einfach eine beliebige Adresse ein. Besucher landen kurz auf ProfessorFilou.de und werden dann weitergeleitet.</p>

            <form id="link-form">
                <div class="input-group">
                    <label for="target-url">Wohin soll der Link führen?</label>
                    <input type="text" id="target-url" placeholder="z. B. youtube.com oder beispiel.de/info" autocomplete="off" required>
                </div>

                <div class="input-group">
                    <label for="delay-select">Kurzer Stopp auf ProfessorFilou.de</label>
                    <select id="delay-select">
                        <option value="2">2 Sekunden (Kurz)</option>
                        <option value="3" selected>3 Sekunden (Standard)</option>
                        <option value="5">5 Sekunden (Mittel)</option>
                    </select>
                </div>

                <button type="submit" class="btn">Teilbaren Link generieren</button>
            </form>

            <div class="result-box" id="result-box">
                <label>Dein fertiger Link:</label>
                <div class="share-row">
                    <input type="text" id="generated-link" class="share-input" readonly>
                </div>
                <div class="action-buttons">
                    <button type="button" id="copy-btn" class="btn-action btn-copy">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        <span>Kopieren</span>
                    </button>
                    <button type="button" id="share-btn" class="btn-action btn-share">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                        <span>Teilen</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Ansicht 2: Weiterleitung aktiv -->
        <div id="redirect-view" class="redirect-view">
            <div class="spinner-wrap">
                <div class="spinner"></div>
            </div>
            <h1>Du wirst weitergeleitet...</h1>
            <p class="subtitle" id="countdown-text">Einen kurzen Moment bitte. Du verlässt gleich ProfessorFilou.de.</p>

            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>

            <div class="target-preview" id="target-display"></div>
            <a href="#" id="manual-link" class="direct-link">Sofort öffnen →</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const encodedTarget = params.get('to');
        const delayParam = parseInt(params.get('t'), 10);

        const generatorView = document.getElementById('generator-view');
        const redirectView = document.getElementById('redirect-view');

        if (encodedTarget) {
            try {
                const base64 = encodedTarget.replace(/-/g, '+').replace(/_/g, '/');
                const targetUrl = decodeURIComponent(escape(window.atob(base64)));

                const parsedUrl = new URL(targetUrl);
                if (parsedUrl.protocol === 'http:' || parsedUrl.protocol === 'https:') {
                    startRedirect(parsedUrl.href, isNaN(delayParam) ? 3 : Math.min(Math.max(delayParam, 1), 15));
                } else {
                    showGenerator();
                }
            } catch (e) {
                showGenerator();
            }
        } else {
            showGenerator();
        }

        function showGenerator() {
            generatorView.style.display = 'block';
            redirectView.style.display = 'none';
        }

        function startRedirect(url, seconds) {
            generatorView.style.display = 'none';
            redirectView.style.display = 'block';

            document.getElementById('target-display').textContent = 'Ziel: ' + url.replace(/^https?:\/\//i, '');
            document.getElementById('manual-link').href = url;

            const progressFill = document.getElementById('progress-fill');
            const countdownText = document.getElementById('countdown-text');

            setTimeout(() => {
                progressFill.style.transitionDuration = seconds + 's';
                progressFill.style.width = '100%';
            }, 50);

            let remaining = seconds;
            countdownText.textContent = `Weiterleitung in ${remaining} Sekunde${remaining === 1 ? '' : 'n'}...`;

            const timer = setInterval(() => {
                remaining--;
                if (remaining > 0) {
                    countdownText.textContent = `Weiterleitung in ${remaining} Sekunde${remaining === 1 ? '' : 'n'}...`;
                } else {
                    clearInterval(timer);
                    countdownText.textContent = 'Leite jetzt weiter...';
                    window.location.replace(url);
                }
            }, 1000);
        }

        document.getElementById('link-form').addEventListener('submit', function(e) {
            e.preventDefault();
            let rawUrl = document.getElementById('target-url').value.trim();
            const delay = document.getElementById('delay-select').value;

            if (!rawUrl) return;

            if (!/^https?:\/\//i.test(rawUrl)) {
                rawUrl = 'https://' + rawUrl;
            }

            const encoded = window.btoa(unescape(encodeURIComponent(rawUrl)))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');

            const baseUrl = window.location.origin + window.location.pathname;
            const shareUrl = `${baseUrl}?to=${encoded}&t=${delay}`;

            const resultBox = document.getElementById('result-box');
            const generatedInput = document.getElementById('generated-link');

            generatedInput.value = shareUrl;
            resultBox.style.display = 'none';
            void resultBox.offsetWidth; // Animation neu triggern
            resultBox.style.display = 'block';
        });

        // Kopieren-Button
        document.getElementById('copy-btn').addEventListener('click', function() {
            const copyInput = document.getElementById('generated-link');
            copyInput.select();
            copyInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyInput.value);

            const btn = this;
            const label = btn.querySelector('span');
            const originalText = label.textContent;
            label.textContent = 'Kopiert ✓';
            btn.style.backgroundColor = '#10b981';
            btn.style.color = '#ffffff';

            setTimeout(() => {
                label.textContent = originalText;
                btn.style.backgroundColor = '';
                btn.style.color = '';
            }, 2000);
        });

        // Teilen-Button (Web Share API + Fallback)
        document.getElementById('share-btn').addEventListener('click', async function() {
            const shareUrl = document.getElementById('generated-link').value;
            const btn = this;
            const label = btn.querySelector('span');

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Link über ProfessorFilou.de',
                        text: 'Schau dir diesen Link an:',
                        url: shareUrl
                    });
                } catch (err) {
                    // Nutzer hat Teilen abgebrochen
                }
            } else {
                // Fallback am Desktop-Browser: Link kopieren & Feedback anzeigen
                navigator.clipboard.writeText(shareUrl);
                const originalText = label.textContent;
                label.textContent = 'Link kopiert ✓';
                btn.style.backgroundColor = '#10b981';

                setTimeout(() => {
                    label.textContent = originalText;
                    btn.style.backgroundColor = '';
                }, 2000);
            }
        });
    </script>
</body>
</html>
